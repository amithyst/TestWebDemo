{% extends 'MC_command/base.html' %}
{% block title %}石头剪刀布{% endblock %}
{% block content %}

<div style="max-width: 600px; margin: 0 auto; text-align: center;">
    <h2>✊✌️🖐️ 心理博弈</h2>
    <div class="balance-box">当前余额: <span id="balance">{{ wallet.balance }}</span></div>
    <hr>

    <div id="game-area">
        <form id="rps-form" onsubmit="playGame(event)">
            {% csrf_token %}
            <div style="margin: 20px 0;">
                <label>下注金额 (Min 20): </label>
                <input type="number" name="bet" value="20" min="20" style="padding: 5px; width: 80px;">
            </div>
            
            <div style="display: flex; justify-content: center; gap: 20px; margin: 30px 0;">
                <label class="choice-card">
                    <input type="radio" name="choice" value="rock" checked> 
                    <span style="font-size: 40px;">✊</span><br>石头
                </label>
                <label class="choice-card">
                    <input type="radio" name="choice" value="scissors"> 
                    <span style="font-size: 40px;">✌️</span><br>剪刀
                </label>
                <label class="choice-card">
                    <input type="radio" name="choice" value="paper"> 
                    <span style="font-size: 40px;">🖐️</span><br>布
                </label>
            </div>

            <button type="submit" class="btn-play">出拳！</button>
        </form>
    </div>

    <div id="result-area" style="margin-top: 20px; padding: 15px; display: none; border-radius: 5px;"></div>
    <br>
    <a href="{% url 'MC_command:casino_lobby' %}">返回大厅</a>
</div>

<style>
    .choice-card { cursor: pointer; padding: 10px; border: 1px solid #eee; border-radius: 5px; }
    .choice-card:hover { background: #f0f0f0; }
    .btn-play { padding: 10px 40px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer;}
</style>

<script>
function playGame(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const resDiv = document.getElementById('result-area');
    
    resDiv.style.display = 'block';
    resDiv.innerHTML = '🤔 对方正在观察你的微表情...';
    resDiv.className = '';

    fetch("{% url 'MC_command:casino_api' 'rps' %}", {
        method: 'POST',
        body: formData,
        headers: {'X-Requested-With': 'XMLHttpRequest'}
    })
    .then(r => r.json())
    .then(data => {
        if(data.status === 'error') {
            resDiv.innerHTML = '❌ ' + data.msg;
            return;
        }
        document.getElementById('balance').innerText = data.balance;
        
        // 结果展示
        let color = data.is_win ? '#d4edda' : (data.outcome=='draw' ? '#fff3cd' : '#f8d7da');
        let emoji = {'rock':'✊', 'paper':'🖐️', 'scissors':'✌️'};
        
        resDiv.style.background = color;
        resDiv.innerHTML = `
            <h3>${data.msg}</h3>
            <p>庄家出了: <span style="font-size: 2em;">${emoji[data.data.sys_choice]}</span></p>
            ${data.payout > 0 ? '<p>获得: '+data.payout+'</p>' : ''}
        `;
    });
}
</script>
{% endblock %}
